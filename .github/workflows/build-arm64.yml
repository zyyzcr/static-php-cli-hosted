name: Build arm64 static php
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build inside alpine arm64
        run: |
          docker run --rm --platform linux/arm64 alpine:3.20 sh -c "
            set -e
            apk add --no-cache bash curl git php-cli cmake make autoconf automake bison flex pkgconf binutils texinfo upx gcc g++ linux-headers re2c gperf gettext-dev patch libtool binutils-gold
            # 这里拉 webman 官方原版仓库（自带 build.php + craft目录）
            git clone https://github.com/webman-php/static-php-cli-hosted.git /src
            cd /src
            ls -la
            curl -#fSL https://dl.static-php.dev/v3/spc-bin/nightly/spc-linux-aarch64 -o spc
            chmod +x spc
            ./spc doctor --auto-fix
            php build.php craft/php-8.4.yml
          "

      - name: Copy output
        run: |
          mkdir -p out
          cid=$(docker create --platform linux/arm64 alpine:3.20 true)
          docker cp $cid:/src/buildroot/bin/php ./out/
          docker cp $cid:/src/buildroot/bin/micro.sfx ./out/
          docker rm $cid

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: php-arm64
          path: out/
