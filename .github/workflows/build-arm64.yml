name: Build Webman arm64 PHP + micro.sfx
on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout static-php-cli-hosted
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build arm64 inside alpine
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src" \
            alpine:3.20 \
            sh -c "
              set -e
              cd /src
              ls -la
              apk add --no-cache bash curl cmake make autoconf automake bison flex pkgconf binutils texinfo upx git php-cli
              curl -#fSL https://dl.static-php.dev/v3/spc-bin/nightly/spc-linux-aarch64 -o spc
              chmod +x spc
              ./spc doctor --auto-fix
              php build.php craft/php-8.4.yml
            "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webman-php8.4-aarch64
          path: |
            buildroot/bin/php
            buildroot/bin/micro.sfx
