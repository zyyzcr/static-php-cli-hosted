name: Build Webman arm64 PHP + micro.sfx
on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build arm64 PHP
        uses: addnab/docker-run-action@v3
        with:
          image: alpine:3.20
          options: --platform linux/arm64 -v ${{ github.workspace }}:/work
          run: |
            set -e
            cd /work
            apk add --no-cache bash curl cmake make autoconf automake bison flex pkgconf binutils texinfo upx git
            curl -#fSL https://dl.static-php.dev/v3/spc-bin/nightly/spc-linux-aarch64 -o spc
            chmod +x spc
            ./spc doctor --auto-fix
            ./spc build:php --craft-file=craft/php-8.4.yml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webman-php8.4-aarch64
          path: |
            buildroot/bin/php
            buildroot/bin/micro.sfx
