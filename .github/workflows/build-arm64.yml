name: Build arm64 static php
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build inside alpine arm64
        run: |
          docker run --rm --platform linux/arm64 alpine:3.20 sh -c "
            set -e
            apk add --no-cache bash curl git php-cli cmake make autoconf automake bison flex pkgconf binutils texinfo upx gcc g++ linux-headers re2c gperf gettext-dev patch libtool binutils-gold
            curl -#fSL https://dl.static-php.dev/v3/spc-bin/nightly/spc-linux-aarch64 -o /usr/local/bin/spc
            chmod +x /usr/local/bin/spc
            spc doctor --auto-fix
            # 直接 spc build，编译 cli + micro，webman打包用
            spc build --build-cli --build-micro --with-upx-pack \
              pdo,pdo_sqlite,openssl,curl,mbstring,json,fileinfo,ctype,dom,xml,zip
          "

      - name: Copy output
        run: |
          mkdir -p out
          cid=$(docker run -d --platform linux/arm64 --rm alpine:3.20 sleep 600)
          docker exec $cid sh -c "
            curl -#fSL https://dl.static-php.dev/v3/spc-bin/nightly/spc-linux-aarch64 -o /usr/local/bin/spc
            chmod +x /usr/local/bin/spc
            spc build --build-cli --build-micro --with-upx-pack pdo,pdo_sqlite,openssl,curl,mbstring,json,fileinfo,ctype,dom,xml,zip
          "
          docker cp $cid:/root/buildroot/bin/php ./out/
          docker cp $cid:/root/buildroot/bin/micro.sfx ./out/
          docker stop $cid

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: php-arm64
          path: out/
